# Dedicated Chatwoot environment for Apple App Review.
#
# WootDesk cannot be assessed without a Chatwoot server, so a reviewer given no
# environment sees a setup screen and nothing else. This stack exists to stay
# up for the whole review window, including any re-review after a rejection.
#
# It holds invented records only. Never point it at a production database or
# object store, and never seed it from real data.
#
# TLS terminates at the host's nginx, so nothing here is published publicly
# except through that proxy.

name: wootdesk-review

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The Chatwoot entrypoint waits for Postgres but never creates the schema, so
  # the app services crash-loop on a fresh volume without this. The task is
  # idempotent, so it is safe on every start.
  db-prepare:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION}
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    volumes:
      - storage:/app/storage

  rails:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      db-prepare: {condition: service_completed_successfully}
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      # Loopback only. The host's nginx is the sole public path in.
      - "127.0.0.1:8100:3000"
    volumes:
      - storage:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      db-prepare: {condition: service_completed_successfully}
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - storage:/app/storage

volumes:
  postgres:
  redis:
  storage:
