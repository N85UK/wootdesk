# Chatwoot environment for Apple App Review, review.n85.app
#
# Follows the host's existing conventions: ACME challenges from the shared
# webroot, everything else redirected to HTTPS, application over loopback.

server {
    listen 80;
    listen [::]:80;
    server_name review.n85.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name review.n85.app;

    ssl_certificate     /etc/letsencrypt/live/review.n85.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.n85.app/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chatwoot accepts file uploads, and the reviewer may attach one.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chatwoot uses ActionCable, so the WebSocket upgrade must pass through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
