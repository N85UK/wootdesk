name: Documentation

# The public WootDesk documentation published at https://docs.n85.app.
#
# This workflow is deliberately independent of the app CI: a documentation
# change must not need a macOS runner, and an app change must not be able to
# publish documentation without these checks passing.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build-and-verify:
    name: Build and verify the public site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # `npm ci` fails rather than resolving if the lock file and manifest
      # disagree, which is what makes the build repeatable.
      - name: Install locked dependencies
        run: npm ci

      - name: Type-check the site
        run: npm run check

      # Stamped before the build so it travels inside the verified artifact. The
      # deploy job fetches this back from the live site to prove the deployment
      # actually replaced what was there, rather than trusting an exit status.
      - name: Stamp the build with its commit
        run: |
          set -euo pipefail
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json
          cat public/build-info.json

      - name: Build
        run: npm run build

      # Proves no private hostname, internal marker, private address or
      # credential reached the source or the generated output.
      - name: Verify the public content boundary
        run: npm run verify:boundary

      - name: Verify internal links
        run: npm run verify:links

      # N85-50 AC4. axe plus a keyboard smoke test against the built output, in
      # light and dark at mobile and desktop. A browser is required: contrast is
      # the rule that actually catches things here, and it cannot be evaluated
      # without layout. This found a real WCAG AA contrast failure on the
      # release pages in dark mode the first time it ran.
      - name: Install the browser for accessibility checks
        run: npx playwright install chromium --with-deps

      - name: Check accessibility and keyboard operation
        run: npm run verify:a11y

      - name: Upload the accessibility report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: docs-site/test-results/
          retention-days: 7

      # A draft release note must never become a route, a sitemap entry or a
      # search record. This asserts the property directly rather than trusting
      # the filter that produces it.
      - name: Assert draft releases are not published
        run: |
          set -euo pipefail
          drafts=$(grep -rl '^status: draft' src/content/releases || true)
          if [ -z "$drafts" ]; then
            echo "No draft release notes present."
            exit 0
          fi
          echo "Draft release notes present:"
          echo "$drafts"
          for file in $drafts; do
            version=$(grep -m1 '^version:' "$file" | sed 's/^version: *"\{0,1\}//; s/"\{0,1\}$//')
            echo "Checking that $version is absent from the build..."
            if [ -e "dist/releases/$version" ]; then
              echo "FAIL: draft $version produced a route at dist/releases/$version"
              exit 1
            fi
            if grep -q "releases/$version" dist/sitemap-0.xml 2>/dev/null; then
              echo "FAIL: draft $version appears in the sitemap"
              exit 1
            fi
            if grep -rq "$version" dist/pagefind 2>/dev/null; then
              echo "FAIL: draft $version appears in the search index"
              exit 1
            fi
          done
          echo "All draft release notes are excluded from routes, sitemap and search."

      # Recorded so a deployment can name exactly what it published, and so a
      # rollback has a verified target to return to.
      - name: Record build evidence
        run: |
          {
            echo "### Documentation build evidence"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Node | \`$(node --version)\` |"
            echo "| Lock file | \`$(sha256sum package-lock.json | cut -d' ' -f1)\` |"
            echo "| Pages built | $(find dist -name '*.html' | wc -l | tr -d ' ') |"
            echo "| Boundary check | passed |"
            echo "| Link check | passed |"
            echo "| Draft exclusion | passed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs-site/dist
          retention-days: 14

  deploy:
    name: Deploy to docs.n85.app
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.n85.app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # N85-47 AC6. The deployed bytes are the ones the checks passed against,
      # not a rebuild that could differ from what was verified.
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: docs-site/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # Locked, so the deployment uses the wrangler version the repository
      # pins rather than whatever npx resolves on the day.
      - name: Install locked dependencies
        run: npm ci

      - name: Confirm the deployment credentials are present
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            # A warning, not a notice. A deployment that quietly does nothing and
            # reports success is how this project lost two TestFlight builds.
            echo "::warning::Cloudflare credentials are absent, so nothing was deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy docs.n85.app."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the Worker
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # N85-47 AC2 and AC6, and the rule this project keeps relearning: fetch the
      # live site and confirm it serves this commit. A deploy step's exit status
      # says the upload was accepted, not that visitors receive the new pages.
      - name: Prove the live site serves this commit
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            served="$(curl -fsS --max-time 20 https://docs.n85.app/build-info.json || true)"
            if echo "$served" | grep -q "$GITHUB_SHA"; then
              echo "docs.n85.app is serving $GITHUB_SHA"
              status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://docs.n85.app/)"
              [ "$status" = "200" ] || { echo "Home page returned $status"; exit 1; }
              exit 0
            fi
            echo "Attempt $attempt: not serving this commit yet."
            sleep 10
          done
          echo "docs.n85.app did not serve $GITHUB_SHA after the deployment."
          exit 1

      - name: Record the deployment
        if: always() && steps.credentials.outputs.configured == 'true'
        run: |
          {
            echo "### Documentation deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Address | https://docs.n85.app |"
            echo "| Result | ${{ steps.deploy.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
