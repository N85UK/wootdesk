name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-availability.yml'
      - 'script/check_docs_availability.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-availability.yml'
      - 'script/check_docs_availability.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: docs-site
env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build-and-verify:
    name: Verify the dedicated retirement artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check the retained documentation source
        run: npm run check
      - name: Test Worker, artifact and offline probe contracts
        run: npm run test:retirement
      - name: Build the separate retirement artifact
        run: npm run build
      - name: Verify public content isolation
        run: npm run verify:boundary
      - name: Verify exact clean source, metadata and artifact bytes
        run: npm run verify:retirement -- --require-clean --expect-commit "$GITHUB_SHA"
      - name: Install the accessibility browser
        run: npx playwright install chromium --with-deps
      - name: Check retirement accessibility and keyboard behaviour
        run: npm run verify:a11y:retirement
      - name: Retain diagnostic fixtures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-check-evidence
          path: docs-site/.retirement-evidence/
          include-hidden-files: true
          retention-days: 7
      - name: Record artifact evidence
        run: |
          {
            echo '### WootDesk retirement artifact'
            echo "Commit: $GITHUB_SHA"
            echo "Manifest SHA256: $(sha256sum retirement-artifact/artifact-manifest.json | cut -d' ' -f1)"
            echo "Lock SHA256: $(sha256sum package-lock.json | cut -d' ' -f1)"
            echo 'Worker/probe/boundary/accessibility checks passed. No legacy assets are published.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only the verified retirement artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-retirement
          path: docs-site/retirement-artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy the dedicated retirement Worker
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.n85.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-retirement
          path: docs-site/retirement-artifact/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install the locked deployment tool
        run: npm ci
      - name: Reverify uploaded bytes against this exact commit
        run: npm run verify:retirement -- --require-clean --expect-commit "$GITHUB_SHA"
      - name: Require the existing deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo '::error::Existing deployment credentials are absent. Nothing was deployed.'
            exit 1
          }
      - name: Record the actual previous active deployment
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments list --name wootdesk-docs --json > previous-deployments.json
          version="$(node scripts/previous-deployment.mjs previous-deployments.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the verified module without rebuilding or assets
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --no-bundle 2>&1 | tee deploy.log
          version="$(sed -n 's/.*Current Version ID: *//p' deploy.log | tail -1)"
          [[ "$version" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify actual retirement and exact metadata without redirects
        id: smoke
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 ../script/check_docs_availability.py --expected-build-info retirement-artifact/build-info.json; then
              exit 0
            fi
            echo "Readback attempt $attempt did not qualify."
            sleep 10
          done
          exit 1
      - name: Record the release and rollback target
        if: always()
        run: |
          {
            echo '### WootDesk retirement deployment'
            echo "Commit: $GITHUB_SHA"
            echo "Deploy outcome: ${{ steps.deploy.outcome }}"
            echo "Strict retirement readback: ${{ steps.smoke.outcome }}"
            echo "Published Worker version: ${{ steps.deploy.outputs.version || 'not qualified' }}"
            echo "Previous full-traffic version: ${{ steps.previous.outputs.version || 'not qualified' }}"
            echo "Manifest SHA256: $(sha256sum retirement-artifact/artifact-manifest.json | cut -d' ' -f1)"
            echo 'Rollback reopens retired content and requires an owner decision.'
            echo 'Use the recorded previous version with wrangler rollback --name wootdesk-docs, then independently verify it.'
          } >> "$GITHUB_STEP_SUMMARY"
