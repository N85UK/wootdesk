# Delivers every green build on main to TestFlight for end-to-end testing.
#
# TestFlight accepts binaries built with a beta Xcode, so this pipeline can run
# ahead of the stable-toolchain requirement that only App Store review imposes.
#
# It does not accept an old SDK. Apple rejects any upload built against an SDK
# earlier than iOS 26 with a 409 at the validation step, TestFlight included, so
# this job needs a runner image carrying Xcode 26 or later. That is a separate
# requirement from beta versus stable and it applies to both.
#
# One-time setup and the required secrets are documented in
# docs/TESTFLIGHT_DELIVERY.md.

name: TestFlight

on:
  push:
    branches: [ main ]
    # A documentation change cannot alter the binary, so it should not consume a
    # build number, six minutes of runner time, and a slot in the tester's
    # update list. Builds 35 and 36 were both spent this way. GitHub evaluates
    # these against the whole push, so a commit touching docs alongside code
    # still delivers.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to deliver
        required: true
        default: ios
        type: choice
        options: [ios, macos, all]

concurrency:
  # Uploads must not race: two runs would claim the same build number.
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Build and upload to TestFlight
    runs-on: macos-26
    # Without the signing secrets this job cannot do anything useful, so it is
    # skipped rather than failing every push on a fork or before setup.
    if: ${{ github.repository == 'N85UK/wootdesk' }}
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history so the commit count used as the build number is correct.
          fetch-depth: 0

      - name: Confirm the delivery secrets are configured
        id: secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [[ -z "${TEAM_ID}" || -z "${CERT}" || -z "${KEY_ID}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight delivery secrets are not configured yet. See docs/TESTFLIGHT_DELIVERY.md. Skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Apple rejects an upload built against an SDK older than iOS 26, and it
      # does so at validation, minutes into the run, as an opaque 409. Checking
      # here turns that into an immediate, readable failure. Selecting the
      # newest Xcode also stops an image that ships several from defaulting to
      # an older one.
      - name: Select an Xcode with a current iOS SDK
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          if [[ -z "$newest" ]]; then
            echo "::error::No Xcode found on the runner image."
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          sdk="$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)"
          echo "Newest iOS SDK: ${sdk:-none}"
          if [[ -z "$sdk" || "$sdk" -lt 26 ]]; then
            echo "::error::This runner's newest iOS SDK is ${sdk:-none}. Apple requires iOS 26 or later for any App Store Connect upload, TestFlight included. Use a runner image with Xcode 26 or later."
            exit 1
          fi

      # Automatic signing provisions the target's development configuration as
      # well as Release, and an ephemeral runner has no development identity,
      # so Xcode mints a fresh one on every archive. Ten accumulated in two
      # days and the account hit Apple's cap, after which every build failed
      # with "Choose a certificate to revoke" and no build reached TestFlight.
      # The failure is silent until the quota is gone, so surface it early.
      - name: Warn when development certificates are accumulating
        if: steps.secrets.outputs.configured == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography 2>/dev/null || true
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          try:
              import jwt
          except Exception:
              print("::notice::Certificate check skipped, pyjwt unavailable."); raise SystemExit(0)
          key = base64.b64decode(os.environ["ASC_KEY_P8"]).decode()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
                              "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/certificates?limit=200",
              headers={"Authorization": f"Bearer {token}"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          dev = [c for c in data.get("data", [])
                 if c["attributes"].get("certificateType") == "DEVELOPMENT"]
          api = [c for c in dev if c["attributes"].get("displayName") == "Created via API"]
          print(f"Development certificates: {len(dev)}, of which CI-created: {len(api)}")
          if len(api) >= 5:
              print(f"::warning::{len(api)} CI-created development certificates exist. "
                    "Apple caps these, and once the cap is reached every archive fails with "
                    "'Choose a certificate to revoke'. Revoke the surplus in the developer "
                    "portal or via the App Store Connect API.")
          PY

      - name: Install XcodeGen
        if: steps.secrets.outputs.configured == 'true'
        run: brew install xcodegen

      - name: Configure Node.js
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A build only reaches testers if the suite is green, so the same checks
      # that gate main also gate delivery.
      - name: Run the full check suite
        if: steps.secrets.outputs.configured == 'true'
        run: ./script/ci.sh

      - name: Import the distribution signing certificate
        if: steps.secrets.outputs.configured == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/wootdesk-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"

          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Install the App Store Connect API key
        if: steps.secrets.outputs.configured == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          # altool discovers keys in this directory by key id, and xcodebuild is
          # given the explicit path.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive, export and upload to TestFlight
        if: steps.secrets.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PLATFORM: ${{ github.event.inputs.platform || 'ios' }}
        run: |
          set -euo pipefail
          # The commit count is monotonic on main and matches the scheme the
          # first manual upload used, so CI numbers continue from it rather
          # than restarting at 1 and being rejected as non-increasing.
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "Build number: $BUILD_NUMBER"
          ./script/release_archive.sh \
            --team "${{ secrets.APPLE_TEAM_ID }}" \
            --platform "$PLATFORM" \
            --build-number "$BUILD_NUMBER" \
            --allow-beta-xcode \
            --upload \
            --authorised-build "${{ github.sha }}"

      - name: Remove the signing keychain
        if: always() && steps.secrets.outputs.configured == 'true'
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 2>/dev/null || true
