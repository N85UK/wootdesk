name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS & iOS)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # This repository is public. The check matches shapes, not the values it
      # keeps out, so it does not reintroduce them itself.
      - name: Check nothing private is published
        run: python3 script/check_public_repo.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run CI Script
        run: ./script/ci.sh
