name: WootDesk
options:
  bundleIdPrefix: dev.n85
  # British English is the source language. Every catalogued string falls back to
  # it when a translation is unavailable.
  developmentLanguage: en-GB
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Extracts localisable strings from source into the String Catalog on build.
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: en-GB
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0.0

targets:
  WootDesk:
    type: application
    platform: macOS
    supportedDestinations:
      - macOS
      - iOS
    sources:
      - path: WootDesk
        excludes:
          - Resources/Info-Debug.plist
          - Resources/Info-Release.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.n85.wootdesk
        PRODUCT_NAME: WootDesk
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WootDesk/Resources/WootDesk.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": WootDesk/Resources/WootDesk-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": WootDesk/Resources/WootDesk-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          INFOPLIST_FILE: WootDesk/Resources/Info-Debug.plist
          APS_ENVIRONMENT: development
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          INFOPLIST_FILE: WootDesk/Resources/Info-Release.plist
          APS_ENVIRONMENT: production
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
    # WootDesk runs sandboxed. It needs outbound network access to reach the user's
    # Chatwoot server and read-only access to files the user explicitly selects
    # for attachment upload. It requests no broad file access, camera, microphone,
    # location, or inbound network server.
    entitlements:
      path: WootDesk/Resources/WootDesk.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)

  WootDeskTests:
    type: bundle.unit-test
    platform: macOS
    supportedDestinations:
      - macOS
      - iOS
    sources:
      - path: WootDeskTests
    dependencies:
      - target: WootDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.n85.wootdesk.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/WootDesk.app/Contents/MacOS/WootDesk"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/WootDesk.app/WootDesk"
        # Without a device entry the build falls back to the macOS path and
        # fails with "Could not find test host", which made running any test on
        # a physical iPhone impossible.
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/WootDesk.app/WootDesk"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
        "BUNDLE_LOADER[sdk=iphonesimulator*]": "$(TEST_HOST)"
        "BUNDLE_LOADER[sdk=iphoneos*]": "$(TEST_HOST)"
        # A physical device refuses an unsigned test bundle. Signing stays off
        # for macOS and the simulator, where CI runs unsigned on purpose.
        "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": "YES"
        "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": "YES"
        "CODE_SIGN_STYLE[sdk=iphoneos*]": "Automatic"
        # The base setting is an empty identity, which a device build rejects
        # outright for a test bundle.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  WootDeskUITests:
    type: bundle.ui-testing
    platform: macOS
    supportedDestinations:
      - macOS
      - iOS
    sources:
      - path: WootDeskUITests
    dependencies:
      - target: WootDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.n85.wootdesk.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        "TEST_TARGET_NAME": "WootDesk"
        # As above: a physical device refuses an unsigned UI test runner.
        "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": "YES"
        "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": "YES"
        "CODE_SIGN_STYLE[sdk=iphoneos*]": "Automatic"
        # The base setting is an empty identity, which a device build rejects
        # outright for a test bundle.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"

schemes:
  WootDesk:
    build:
      targets:
        WootDesk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: WootDeskTests
        - name: WootDeskUITests
