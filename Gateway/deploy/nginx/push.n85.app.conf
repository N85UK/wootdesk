# WootDesk Push Gateway, push.n85.app
#
# Follows the conventions already used on this host: ACME challenges served
# from the shared webroot, everything else redirected to HTTPS, and the
# application reached over loopback only.

limit_req_zone $binary_remote_addr zone=wootdesk_push:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name push.n85.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name push.n85.app;

    ssl_certificate     /etc/letsencrypt/live/push.n85.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.n85.app/privkey.pem;

    # The gateway speaks a small JSON API. Nothing here should ever be indexed
    # or embedded, and every response is machine-read.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Registration and webhook bodies are capped well below this by the
    # application's own MAX_BODY_BYTES. This is a cheap outer bound.
    client_max_body_size 64k;

    # The webhook route secret lives in the request path, so it must never be
    # written to the access log.
    access_log off;

    location / {
        limit_req zone=wootdesk_push burst=60 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
