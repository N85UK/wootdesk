# Production deployment of the WootDesk Push Gateway.
#
# The service listens on plain HTTP and is published to loopback only. The
# host's nginx terminates TLS and is the sole public path in, which is the
# boundary described in Gateway/README.md.
#
# Secrets come from the host .env, which script/deploy_gateway.sh renders from
# Infisical at deploy time. Nothing secret is baked into the image.

name: wootdesk-push

services:
  gateway:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: wootdesk-push-gateway:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_FILE: /data/registrations.json
      APNS_PRIVATE_KEY_FILE: /run/secrets/apns.p8
    ports:
      # Loopback only. nginx is the only thing that may reach this.
      - "127.0.0.1:8090:8080"
    volumes:
      - data:/data
      - ./apns.p8:/run/secrets/apns.p8:ro
    healthcheck:
      # The header is required, not decorative. The gateway refuses any request
      # that does not arrive as HTTPS, and in production the loopback exemption
      # is switched off, so a plain probe gets 426 and can never pass. Without
      # it this container reported unhealthy continuously from the moment it
      # started, 2084 consecutive failures, while the service was serving
      # traffic correctly. An alarm that is always on carries no signal.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz',{headers:{'x-forwarded-proto':'https'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
