# Dedicated invented-data Chatwoot server for WootDesk compatibility acceptance.
#
# This stack exists only to satisfy the dedicated-server requirements in
# docs/CHATWOOT_COMPATIBILITY.md. It is isolated from every production Chatwoot
# database and object store, contains invented records only, and is resettable.
#
# The Chatwoot version is pinned through CHATWOOT_VERSION so the supported
# version matrix can record an exact image rather than a floating tag.

name: wootdesk-compat

services:
  postgres:
    # Chatwoot 4.x requires pgvector, so the plain postgres image is not enough.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in compat/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in compat/.env}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # The Chatwoot entrypoint waits for Postgres but never creates the schema, so
  # rails and sidekiq crash-loop on a fresh volume with
  # `relation "installation_configs" does not exist`. This one-shot service
  # prepares the database and exits, and the app services wait for it to finish.
  # db:chatwoot_prepare is idempotent, so it is safe on every start.
  db-prepare:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION in compat/.env}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    volumes:
      - storage:/app/storage

  rails:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION in compat/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - storage:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:?set CHATWOOT_VERSION in compat/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - storage:/app/storage

  # WootDesk refuses plain HTTP outside localhost, and the live compatibility
  # tests run with isDebug false, so the server must present a trusted HTTPS
  # certificate. Caddy issues one from its own local CA.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [rails]
    ports:
      - "${COMPAT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  redis:
  storage:
  caddy-data:
  caddy-config:
